[project]
name = "slim-serve"
version = "0.1.1"
description = "A small, observable inference server for local small language models (llama.cpp / MLX backends)."
readme = "PYPI.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["llm", "inference", "llama.cpp", "mlx", "openai", "serving", "small-language-models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "loguru>=0.7",
    "psutil>=5.9",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ragnarlothbrok53/slm-inference-machine"
Repository = "https://github.com/ragnarlothbrok53/slm-inference-machine"
Changelog = "https://github.com/ragnarlothbrok53/slm-inference-machine/blob/main/CHANGELOG.md"
Issues = "https://github.com/ragnarlothbrok53/slm-inference-machine/issues"

[project.optional-dependencies]
# Backends are optional so the server, tests and benchmarks install anywhere.
llama = ["llama-cpp-python>=0.3"]
mlx = ["mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
slim-serve = "slim_serve.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-psutil",
]

# Prebuilt CPU wheels for llama-cpp-python (Linux/macOS/Windows), so installing does not
# require a C++ toolchain. For CUDA/Metal builds, see the llama-cpp-python docs.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slim_serve"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["llama_cpp.*", "mlx_lm.*", "mlx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
